# The repo's first CI. Until now every green result — unit suites and the
# headless-Chrome drivers alike — came from someone running them locally and
# reporting the number, which is exactly the kind of assurance that quietly
# stops happening.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so the npm cross-check (supply-chain job) re-verifies the vendored
  # crypto even in a quiet week: a dependency can be tampered with long after
  # the commit that last touched it.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit + pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # npm ci (not install) is the point: it installs the lockfile exactly and
      # fails if a manifest has drifted from it.
      - run: npm ci

      - name: unit suites
        run: npm test

      # The crypto packages are served into the page with the seed in scope, so
      # a pin eroding is a security regression, not a chore.
      - name: pins intact
        run: node scripts/check-pins.mjs

      # Offline stages only (disk-vs-lock, archive-vs-lock, installed-vs-
      # package-lock): fast, no network, so a PR can never go red because npm
      # had a bad minute. The archive stage is the one that catches a lock
      # whose bytes differ from what `git archive` would deploy — that
      # mismatch does not degrade, it refuses to boot.
      - name: vendored tree matches the lock (offline)
        run: npm run vendor:verify
        env:
          VENDOR_VERIFY_OFFLINE: '1'

      - name: lockfile is in sync with the manifests
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json \
            || { echo "package-lock.json is stale — run npm install --package-lock-only and commit it"; exit 1; }

      - name: audit
        run: npm audit --audit-level=high

  drivers:
    name: browser drivers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci

      # google-chrome-stable ships on the ubuntu-latest runner image; using it
      # directly keeps a third-party action out of the supply chain of a wallet.
      - name: chrome present
        run: google-chrome --version

      # scripts/run-drivers.sh owns the ritual these need: a fresh profile per
      # driver, and no survivors between runs.
      - name: run drivers
        run: ./scripts/run-drivers.sh

      - name: driver logs on failure
        if: failure()
        run: |
          for f in /tmp/chrome-ci.log /tmp/wallet-ci.log /tmp/fake-indexer-ci.log; do
            echo "── $f"; tail -40 "$f" 2>/dev/null || echo "(none)"
          done

  # The npm cross-check: re-download each vendored package's PUBLISHED tarball
  # and compare it against vendor.lock. This is the only stage that catches the
  # re-lock attack — an edited crypto file plus a regenerated lock passes every
  # local check, because the lock now describes the tampered bytes. npm's
  # published bytes are the one thing the attacker cannot rewrite.
  #
  # Kept OUT of the PR path deliberately: it needs the network, and a security
  # check that goes red when npm hiccups is a check people learn to ignore.
  # Runs where it actually guards production — pushes to main — plus weekly.
  supply-chain:
    name: vendored crypto vs published npm
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci

      - name: vendored crypto matches what npm published
        run: npm run vendor:verify
